---
# Opik backend external dependencies: REDIS_URL (Valkey) + S3_*
# (Athena MinIO at s3.athena.notyouraverage.dev). Re-sealed when the
# Valkey service was named `valkey` (not the previously assumed
# `valkey-primary`).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: opik-external-creds
  namespace: opik
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_SECRET_ACCESS_KEY: 
    IS_MINIO: 
    REDIS_URL: 
    S3_BUCKET: 
    S3_REGION: 
    S3_URL: 
  template:
    metadata:
      name: opik-external-creds
      namespace: opik
    type: Opaque
