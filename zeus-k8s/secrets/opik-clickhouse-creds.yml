---
# ClickHouse `opik` user password, consumed by the Opik backend chart
# via envFrom. Must match the password_sha256_hex declared in
# zeus-k8s/databases/clickhouse/cluster.yml `extraUsersConfig`.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: opik-clickhouse-creds
  namespace: opik
spec:
  encryptedData:
    ANALYTICS_DB_MIGRATIONS_PASS: 
    ANALYTICS_DB_PASS: 
  template:
    metadata:
      name: opik-clickhouse-creds
      namespace: opik
