---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixpost
  namespace: mixpost
  labels:
    app.kubernetes.io/name: mixpost
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mixpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mixpost
    spec:
      containers:
        - name: mixpost
          image: inovector/mixpost:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mixpost-env
            - secretRef:
                name: mixpost-app-secrets
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage/app
              subPath: app
            - name: storage
              mountPath: /var/www/html/storage/logs
              subPath: logs
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: mixpost-storage
