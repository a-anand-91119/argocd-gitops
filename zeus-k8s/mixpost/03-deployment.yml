---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixpost
  namespace: mixpost
  labels:
    app.kubernetes.io/name: mixpost
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mixpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mixpost
    spec:
      containers:
        - name: mixpost
          image: inovector/mixpost:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mixpost-env
            - secretRef:
                name: mixpost-app-secrets
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage/app
              subPath: app
            - name: storage
              mountPath: /var/www/html/storage/logs
              subPath: logs
          # start.sh does a recursive chown over 16k+ vendor files plus
          # cp of commands/migrations + legacy-migration SQL work before
          # nginx binds to :80. On Longhorn-backed first-boot this can
          # take 5-10 min; startupProbe's 30-min window (180*10s) covers
          # this so liveness/readiness don't SIGKILL (exit 137) mid-chown.
          #
          # Probe path is /mixpost/login (not /), because the app's
          # APP_URL is https://mixpost.notyouraverage.dev and GET / on
          # port 80 returns 302 to https://.../mixpost. K8s httpGet
          # follows redirects, so the probe then tries HTTPS on :80 and
          # fails with "server gave HTTP response to HTTPS client".
          # /mixpost/login returns 200 directly with no redirect.
          startupProbe:
            httpGet:
              path: /mixpost/login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /mixpost/login
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /mixpost/login
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 5Gi
            limits:
              memory: 5Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: mixpost-storage
