---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixpost
  namespace: mixpost
  labels:
    app.kubernetes.io/name: mixpost
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mixpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mixpost
    spec:
      containers:
        - name: mixpost
          image: inovector/mixpost:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mixpost-env
            - secretRef:
                name: mixpost-app-secrets
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage/app
              subPath: app
            - name: storage
              mountPath: /var/www/html/storage/logs
              subPath: logs
          # start.sh does a recursive chown over 16k+ vendor files plus
          # cp of commands/migrations + legacy-migration SQL work before
          # Apache binds to :80. On Longhorn-backed first-boot this can
          # take 5-10 min. startupProbe gives 10 min before liveness/
          # readiness kick in; without it, liveness SIGKILLs (exit 137)
          # mid-chown and the pod crash-loops indefinitely.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 1Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: mixpost-storage
