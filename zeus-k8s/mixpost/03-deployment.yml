---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixpost
  namespace: mixpost
  labels:
    app.kubernetes.io/name: mixpost
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mixpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mixpost
    spec:
      # fsGroup makes the kubelet own the volume as gid 33 (www-data) at
      # mount time. OnRootMismatch skips the recursive chown when the
      # root dir already matches — so first boot pays the cost once, and
      # subsequent restarts are instant. Pair with the shadowed `chown`
      # in the container command below so start.sh's own recursive chown
      # over NFS/Longhorn storage becomes a no-op.
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mixpost
          image: inovector/mixpost:latest
          imagePullPolicy: IfNotPresent
          # Shadow `chown` with a no-op at /usr/local/bin/chown (earlier
          # in PATH than /bin/chown) before exec'ing the image's start.sh.
          # fsGroup already handles volume perms, so start.sh's recursive
          # chown over Longhorn-backed storage is wasted work. start.sh's
          # other setup (cp commands/migrations, legacy SQL) still runs.
          command: ["/bin/sh", "-c"]
          args:
            - |
              printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/chown
              chmod +x /usr/local/bin/chown
              exec /usr/local/bin/start.sh
          # start.sh's admin-seed step is hardcoded to admin@example.com
          # and the mixpost-auth:create command takes no --email/--password
          # flags, so the ADMIN_EMAIL/ADMIN_NAME/ADMIN_PASSWORD env vars
          # from mixpost-app-secrets are ignored by the upstream image.
          # This postStart polls until migrations are done, then syncs the
          # admin user from env (idempotent — no-op on restart if already
          # matching) and removes the default admin@example.com if it was
          # seeded. Without this the installed admin would be the default
          # and the configured secret would be cosmetic.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    cd /var/www/html
                    for i in $(seq 1 120); do
                      php artisan tinker --execute='echo \Schema::hasTable("users") ? "ok" : "wait";' 2>/dev/null | grep -q ok && break
                      sleep 5
                    done
                    php artisan tinker --execute='
                      $cls = class_exists("Inovector\\MixpostAuth\\Models\\User")
                        ? "Inovector\\MixpostAuth\\Models\\User"
                        : "Inovector\\Mixpost\\Models\\User";
                      $email = getenv("ADMIN_EMAIL");
                      $name  = getenv("ADMIN_NAME") ?: "Admin";
                      $pass  = getenv("ADMIN_PASSWORD");
                      if (!$email || !$pass) { exit; }
                      $u = $cls::firstOrNew(["email" => $email]);
                      $u->name = $name;
                      $u->password = bcrypt($pass);
                      $u->save();
                      if ($email !== "admin@example.com") {
                        $cls::where("email","admin@example.com")->delete();
                      }
                    '
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mixpost-env
            - secretRef:
                name: mixpost-app-secrets
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage/app
              subPath: app
            - name: storage
              mountPath: /var/www/html/storage/logs
              subPath: logs
          # Probe path is /mixpost/login (not /), because the app's
          # APP_URL is https://mixpost.notyouraverage.dev and GET / on
          # port 80 returns 302 to https://.../mixpost. K8s httpGet
          # follows redirects, so the probe then tries HTTPS on :80 and
          # fails with "server gave HTTP response to HTTPS client".
          # /mixpost/login returns 200 directly with no redirect.
          startupProbe:
            httpGet:
              path: /mixpost/login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /mixpost/login
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /mixpost/login
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 5Gi
            limits:
              memory: 5Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: mixpost-storage
