---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homer
  namespace: homer
  labels:
    app.kubernetes.io/name: homer
  annotations:
    # Stakater Reloader watches the homer-config ConfigMap *and* the
    # homer-smartcard-creds Secret, rolling this deployment when either
    # changes. Required because the ConfigMap is mounted via subPath,
    # which kubelet does NOT auto-refresh; the Secret is consumed by
    # the init container so its values are baked in at pod start.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homer
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: homer
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Init container: render ${VAR} placeholders in the ConfigMap
      # YAML files using values from the homer-smartcard-creds Secret.
      # alpine + gettext gives us envsubst in ~8 MB. Output goes to a
      # shared emptyDir that the homer container mounts read-only.
      initContainers:
        - name: render-config
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache gettext >/dev/null
              for f in config.yml tailscale.yml lan.yml; do
                envsubst < /tpl/$f > /rendered/$f
              done
              echo "Rendered $(ls /rendered | tr '\n' ' ')"
          envFrom:
            - secretRef:
                name: homer-smartcard-creds
          volumeMounts:
            - name: config-tpl
              mountPath: /tpl
              readOnly: true
            - name: config-rendered
              mountPath: /rendered
          # Override pod-level runAsNonRoot so apk can write to
          # /etc/apk/db. The init container only writes into the
          # ephemeral tmpfs emptyDir; the long-running homer
          # container still runs as the unprivileged 1000 user.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: homer
          image: b4bz/homer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config-rendered
              mountPath: /www/assets/config.yml
              subPath: config.yml
              readOnly: true
            - name: config-rendered
              mountPath: /www/assets/tailscale.yml
              subPath: tailscale.yml
              readOnly: true
            - name: config-rendered
              mountPath: /www/assets/lan.yml
              subPath: lan.yml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config-tpl
          configMap:
            name: homer-config
            items:
              - key: config.yml
                path: config.yml
              - key: tailscale.yml
                path: tailscale.yml
              - key: lan.yml
                path: lan.yml
        - name: config-rendered
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
