---
# UNSEALED placeholder Secret for Homer smart-card credentials.
# DO NOT LEAVE THIS UNSEALED IN THE REPO — workflow:
#
#   1. Fill in the real values below (overwrite each REPLACE_ME_*).
#   2. Tell Claude to seal it. Claude will run:
#        kubeseal --format=yaml \
#          < zeus-k8s/homer/_secret-template.yml \
#          > zeus-k8s/secrets/homer-smartcard-creds.yml
#      and then `git rm` this template file.
#   3. The sealed version under zeus-k8s/secrets/ is what ArgoCD applies.
#
# Notes:
#  - PROXMOX_NODE_NAME is the node hostname in Proxmox (e.g. "pve",
#    "athena"). Find it under Datacenter view in the Proxmox UI.
#  - PROXMOX_API_TOKEN must include the full prefix:
#      PVEAPIToken=USER@REALM!TOKENID=UUID
#    Generate at: Datacenter > Permissions > API Tokens
#    (PVEAuditor role is sufficient; uncheck "Privilege Separation" or
#    grant the role on /).
#  - PIHOLE_API_KEY: Pi-hole UI > Settings > API > Show API token.
#    (For Pi-hole v6 set apiVersion: 6 in the ConfigMap; we're on 5.)
#  - IMMICH_API_KEY: Immich UI > Account Settings > API Keys
#    (requires Immich >= 1.118).
apiVersion: v1
kind: Secret
metadata:
  name: homer-smartcard-creds
  namespace: homer
type: Opaque
stringData:
  PIHOLE_API_KEY: "REPLACE_ME_PIHOLE_API_KEY"
  IMMICH_API_KEY: "REPLACE_ME_IMMICH_API_KEY"
  PROXMOX_NODE_NAME: "REPLACE_ME_PROXMOX_NODE_NAME"
  PROXMOX_API_TOKEN: "REPLACE_ME_PROXMOX_API_TOKEN"
