---
# Homer dashboard config — single-page column grid grouped by function.
# Icons: NX211/homer-icons (community standard) + FontAwesome fallback.
# Smart `type: Ping` cards attempt a live status check; CORS may keep the
# indicator grey for cross-origin Pangolin resources, which is fine.
#
# Mounted at /www/assets/config.yml. Updates propagate within ~60s on
# browser refresh — no pod restart required.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: homer
data:
  config.yml: |
    title: "Notyouraverage"
    subtitle: "homelab"
    documentTitle: "Homelab"
    icon: "fas fa-bolt"
    header: true
    footer: false

    # Auto picks 1-4 columns based on viewport. Set "3" or "4" to lock.
    columns: "auto"
    connectivityCheck: true

    # Top notification bar — useful for ops messages or links to monitoring.
    message:
      style: "is-dark"
      title: "Status"
      icon: "fa fa-grip-horizontal"
      content: "Self-hosted services across Zeus K8s, Athena (Proxmox), and Zeus host. All public URLs are auth-gated via Pangolin."

    # Header quick-links (top-right). Keep this short — bookmarks for the
    # things you hit constantly that don't deserve their own card.
    links:
      - name: "Pangolin"
        icon: "fas fa-shield-alt"
        url: "https://pangolin.notyouraverage.dev"
        target: "_blank"
      - name: "GitLab"
        icon: "fab fa-gitlab"
        url: "https://gitlab.notyouraverage.dev"
        target: "_blank"
      - name: "Repo"
        icon: "fas fa-code-branch"
        url: "https://gitlab.notyouraverage.dev/a.anand.91119/argocd-gitops"
        target: "_blank"

    defaults:
      layout: columns
      colorTheme: auto

    theme: default
    colors:
      light:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#f5f5f5"
        card-background: "#ffffff"
        text: "#363636"
        text-header: "#ffffff"
        text-title: "#303030"
        text-subtitle: "#424242"
        card-shadow: rgba(0, 0, 0, 0.1)
        link: "#3273dc"
        link-hover: "#363636"
      dark:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#131313"
        card-background: "#2b2b2b"
        text: "#eaeaea"
        text-header: "#ffffff"
        text-title: "#fafafa"
        text-subtitle: "#f5f5f5"
        card-shadow: rgba(0, 0, 0, 0.4)
        link: "#3273dc"
        link-hover: "#ffdd57"

    # Functional groups (not location). Each renders as a card; cards lay
    # out into auto columns. Service location is encoded in `tag:` so you
    # can scan visually which host hosts what.
    services:
      # -----------------------------------------------------------------
      - name: "Infrastructure"
        icon: "fas fa-network-wired"
        items:
          - name: "ArgoCD"
            subtitle: "GitOps controller"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/argocd.png"
            url: "https://argocd.k8s.notyouraverage.dev"
            target: "_blank"
            type: "Ping"
            endpoint: "https://argocd.k8s.notyouraverage.dev"
          - name: "Linkerd"
            subtitle: "Service mesh"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/cncf/artwork/main/projects/linkerd/icon/color/linkerd-icon-color.png"
            url: "https://linkerd.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Vault"
            subtitle: "Secrets management"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/vault.png"
            url: "https://vault.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Proxmox"
            subtitle: "Hypervisor — Athena"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/proxmox.png"
            url: "https://proxmox.athena.notyouraverage.dev"
            target: "_blank"
          - name: "Pangolin"
            subtitle: "Edge auth / SSO"
            tag: "edge"
            icon: "fas fa-shield-alt"
            url: "https://pangolin.notyouraverage.dev"
            target: "_blank"

      # -----------------------------------------------------------------
      - name: "Storage & Data"
        icon: "fas fa-database"
        items:
          - name: "Longhorn"
            subtitle: "Block storage"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/longhorn.png"
            url: "https://longhorn.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "MinIO Console"
            subtitle: "Object store UI — Athena"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/minio.png"
            url: "https://minio.athena.notyouraverage.dev"
            target: "_blank"
          - name: "MinIO S3"
            subtitle: "S3 API — Athena (runner cache)"
            tag: "athena"
            icon: "fas fa-cube"
            url: "https://s3.athena.notyouraverage.dev"
            target: "_blank"

      # -----------------------------------------------------------------
      - name: "Apps"
        icon: "fas fa-th-large"
        items:
          - name: "Mixpost"
            subtitle: "Social scheduler"
            tag: "k8s"
            icon: "fas fa-share-alt"
            url: "https://mixpost.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Immich"
            subtitle: "Photos"
            tag: "zeus"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/immich.png"
            url: "https://immich.zeus.notyouraverage.dev"
            target: "_blank"
          - name: "n8n"
            subtitle: "Workflow automation"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/n8n.png"
            url: "https://n8n.athena.notyouraverage.dev"
            target: "_blank"
          - name: "Excalidraw"
            subtitle: "Whiteboarding"
            tag: "athena"
            icon: "fas fa-pencil-ruler"
            url: "https://excalidraw.athena.notyouraverage.dev"
            target: "_blank"
          - name: "LocalStack"
            subtitle: "Local AWS emulator"
            tag: "k8s"
            icon: "fas fa-cloud"
            url: "https://localstack-k8s.notyouraverage.dev"
            target: "_blank"

      # -----------------------------------------------------------------
      - name: "Observability & Security"
        icon: "fas fa-chart-line"
        items:
          - name: "Grafana"
            subtitle: "Dashboards & alerts"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/grafana.png"
            url: "https://grafana.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Zabbix"
            subtitle: "Infrastructure monitoring"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/zabbix.png"
            url: "https://zabbix.athena.notyouraverage.dev"
            target: "_blank"
          - name: "Wazuh"
            subtitle: "SIEM / endpoint security"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/wazuh.png"
            url: "https://wazuh.athena.notyouraverage.dev"
            target: "_blank"
          - name: "Web Check"
            subtitle: "Site analyzer"
            tag: "athena"
            icon: "fas fa-search-location"
            url: "https://web-check.athena.notyouraverage.dev"
            target: "_blank"

      # -----------------------------------------------------------------
      - name: "Code & Ops"
        icon: "fas fa-code"
        items:
          - name: "GitLab"
            subtitle: "Self-hosted SCM + CI"
            tag: "self"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/gitlab.png"
            url: "https://gitlab.notyouraverage.dev"
            target: "_blank"
          - name: "GitLab Runners"
            subtitle: "Cache: s3.athena → gitlab-nyad-runner-caches"
            tag: "k8s"
            icon: "fas fa-cogs"
            url: "https://gitlab.notyouraverage.dev/admin/runners"
            target: "_blank"
          - name: "Cloudflare"
            subtitle: "DNS / tunnels / WAF"
            tag: "saas"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/cloudflare.png"
            url: "https://dash.cloudflare.com"
            target: "_blank"
          - name: "Anthropic Console"
            subtitle: "Claude API"
            tag: "saas"
            icon: "fas fa-robot"
            url: "https://console.anthropic.com"
            target: "_blank"

      # -----------------------------------------------------------------
      # Mac Mini services — reachable only inside Tailscale VPN.
      - name: "Mac Mini (Tailscale)"
        icon: "fab fa-apple"
        items:
          - name: "OpenClaw Gateway"
            subtitle: "Pick access path — public / Tailscale / LAN"
            tag: "multi-access"
            icon: "fas fa-network-wired"
            url: "/assets/chooser.html?svc=openclaw"
            target: "_self"
          - name: "Iris Dashboard"
            subtitle: "Pick access path — public / Tailscale / LAN"
            tag: "multi-access"
            icon: "fas fa-eye"
            url: "/assets/chooser.html?svc=iris"
            target: "_self"

      # -----------------------------------------------------------------
      # Unraid placeholder — replace when URLs are known.
      # - name: "Unraid"
      #   icon: "fas fa-hdd"
      #   items:
      #     - name: "Unraid WebUI"
      #       subtitle: "TODO"
      #       tag: "unraid"
      #       icon: "fas fa-cog"
      #       url: "http://unraid.local"
      #       target: "_blank"

  # Multi-access chooser. Tiles in config.yml that have more than one
  # reachable URL (public via Pangolin, Tailscale DNS, LAN IP) point at
  # /assets/chooser.html?svc=<id>; the page renders one button per path
  # defined in the SERVICES map below. Add a new service by appending an
  # entry — Reloader will roll the deployment automatically.
  chooser.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Pick access path</title>
      <style>
        :root { color-scheme: light dark; }
        html, body { height: 100%; margin: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: #f5f5f5; color: #303030;
          display: flex; align-items: center; justify-content: center;
          padding: 1.5rem;
        }
        @media (prefers-color-scheme: dark) {
          body { background: #131313; color: #fafafa; }
          .card { background: #2b2b2b; box-shadow: 0 2px 12px rgba(0,0,0,.4); }
          .btn { background: #3367d6; color: #fff; }
          .btn:hover { background: #5a95f5; }
          .meta { color: #bdbdbd; }
        }
        .card {
          background: #fff; border-radius: 12px; padding: 1.75rem 1.75rem 1.5rem;
          box-shadow: 0 2px 12px rgba(0,0,0,.1);
          width: 100%; max-width: 28rem;
        }
        h1 { margin: 0 0 .25rem; font-size: 1.25rem; }
        .meta { font-size: .85rem; color: #666; margin: 0 0 1.25rem; }
        .btn {
          display: block; width: 100%; box-sizing: border-box;
          padding: .85rem 1rem; margin: .5rem 0;
          background: #3367d6; color: #fff; text-decoration: none;
          border-radius: 8px; font-weight: 600; font-size: 1rem;
          text-align: left; transition: background .15s ease;
        }
        .btn:hover { background: #4285f4; }
        .btn small { display: block; font-weight: 400; font-size: .8rem; opacity: .85; margin-top: .15rem; word-break: break-all; }
        .back { display: inline-block; margin-top: 1rem; font-size: .85rem; color: inherit; opacity: .7; }
        .err { padding: 1rem; background: rgba(220,80,80,.12); border-radius: 8px; }
      </style>
    </head>
    <body>
      <div class="card" id="root"></div>
      <script>
        // Edit this map to add or update services. Keys: public, tailscale, lan.
        // Omit any key that doesn't apply — its button won't render.
        const SERVICES = {
          iris: {
            name: "Iris Dashboard",
            public: "https://homer.iris.notyouraverage.dev/",
            tailscale: "http://as-mac-mini.dzo-bee.ts.net:8081/"
          },
          openclaw: {
            name: "OpenClaw Gateway",
            tailscale: "https://as-mac-mini.dzo-bee.ts.net/overview"
          }
        };

        const LABELS = {
          public:    { title: "Public",    hint: "via Cloudflare Tunnel + Pangolin (works anywhere)" },
          tailscale: { title: "Tailscale", hint: "requires Tailscale VPN connection" },
          lan:       { title: "LAN",       hint: "requires being on the local network" }
        };

        const root = document.getElementById("root");
        const params = new URLSearchParams(location.search);
        const svc = SERVICES[params.get("svc")];

        function renderError() {
          const err = document.createElement("div");
          err.className = "err";
          const strong = document.createElement("strong");
          strong.textContent = "Service not found.";
          err.appendChild(strong);
          err.appendChild(document.createElement("br"));
          err.appendChild(document.createTextNode("Check the link or go back to the dashboard."));
          root.appendChild(err);
          const back = document.createElement("a");
          back.className = "back";
          back.href = "/";
          back.textContent = "← Back to Homer";
          root.appendChild(back);
        }

        function renderService(svc) {
          const h1 = document.createElement("h1");
          h1.textContent = svc.name;
          root.appendChild(h1);

          const meta = document.createElement("p");
          meta.className = "meta";
          meta.textContent = "Pick the access path that works on your current network.";
          root.appendChild(meta);

          ["public", "tailscale", "lan"].forEach(function (key) {
            const url = svc[key];
            if (!url) return;
            const a = document.createElement("a");
            a.className = "btn";
            a.href = url;
            a.target = "_top";
            a.rel = "noopener";
            a.appendChild(document.createTextNode(LABELS[key].title + " "));
            const sub = document.createElement("small");
            sub.textContent = LABELS[key].hint + " · " + url;
            a.appendChild(sub);
            root.appendChild(a);
          });

          const back = document.createElement("a");
          back.className = "back";
          back.href = "/";
          back.textContent = "← Back to Homer";
          root.appendChild(back);
        }

        if (!svc) renderError(); else renderService(svc);
      </script>
    </body>
    </html>
