---
# Homer dashboard — three views (Public / Tailscale / LAN) sharing the
# SAME group structure so toggling between them only swaps URLs in
# place, never reshuffles the layout.
#
# Files in this ConfigMap (each mounted at /www/assets/<name>):
#   config.yml     — Public view (default, loaded at #)
#   tailscale.yml  — Tailscale view  (loaded at #tailscale)
#   lan.yml        — LAN view        (loaded at #lan)
#
# Stable groups (left-to-right, top-to-bottom):
#   ⭐ Favourites          — same tiles in all three views
#   ⚙ Zeus (K8s)          — services on the Kubernetes cluster
#   🖥 Athena (Proxmox)    — VMs on the Proxmox host
#   🍎 Mac Mini / Iris     — Iris service stack on the Mac Mini
#   🐳 Zeus / Unraid       — Docker containers on the Unraid host (Zeus)
#   🌐 Network & NAS       — Pi-hole, Nano KVM, Unraid main UI
#   ☁ SaaS / External     — third-party consoles
#
# Tag colour = access path (consistent across views):
#   public    → is-success (green)
#   tailscale → is-info    (blue)
#   lan       → is-warning (yellow)
#
# Logos: NX211/homer-icons (raw.githubusercontent.com paths) where the
# project has a logo for the service; FontAwesome icon as fallback for
# custom apps.
#
# Smart cards: Pi-hole, Proxmox, Uptime Kuma, and Immich are wired up
# as Homer smart cards and will fetch live stats once their API keys /
# tokens are filled in (search for TODO_*_API_KEY / TODO_*_TOKEN).
# Without credentials they render as plain link tiles — no breakage.
#
# Reloader watches this ConfigMap → rolls the deployment on edit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: homer
data:

  # ===========================================================================
  # PUBLIC VIEW (default)
  # ===========================================================================
