---
# Homer dashboard config — single-page column grid grouped by function.
# Icons: NX211/homer-icons (community standard) + FontAwesome fallback.
# Smart `type: Ping` cards attempt a live status check; CORS may keep the
# indicator grey for cross-origin Pangolin resources, which is fine.
#
# Mounted at /www/assets/config.yml. Updates propagate within ~60s on
# browser refresh — no pod restart required.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: homer
data:
  config.yml: |
    title: "Notyouraverage"
    subtitle: "homelab"
    documentTitle: "Homelab"
    icon: "fas fa-bolt"
    header: true
    footer: false

    # Auto picks 1-4 columns based on viewport. Set "3" or "4" to lock.
    columns: "auto"
    connectivityCheck: true

    # Top notification bar — useful for ops messages or links to monitoring.
    message:
      style: "is-dark"
      title: "Status"
      icon: "fa fa-grip-horizontal"
      content: "Self-hosted services across Zeus K8s, Athena (Proxmox), and Zeus host. All public URLs are auth-gated via Pangolin."

    # Header quick-links (top-right). Keep this short — bookmarks for the
    # things you hit constantly that don't deserve their own card.
    links:
      - name: "Pangolin"
        icon: "fas fa-shield-alt"
        url: "https://pangolin.notyouraverage.dev"
        target: "_blank"
      - name: "GitLab"
        icon: "fab fa-gitlab"
        url: "https://gitlab.notyouraverage.dev"
        target: "_blank"
      - name: "Repo"
        icon: "fas fa-code-branch"
        url: "https://gitlab.notyouraverage.dev/a.anand.91119/argocd-gitops"
        target: "_blank"

    defaults:
      layout: columns
      colorTheme: auto

    theme: default
    colors:
      light:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#f5f5f5"
        card-background: "#ffffff"
        text: "#363636"
        text-header: "#ffffff"
        text-title: "#303030"
        text-subtitle: "#424242"
        card-shadow: rgba(0, 0, 0, 0.1)
        link: "#3273dc"
        link-hover: "#363636"
      dark:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#131313"
        card-background: "#2b2b2b"
        text: "#eaeaea"
        text-header: "#ffffff"
        text-title: "#fafafa"
        text-subtitle: "#f5f5f5"
        card-shadow: rgba(0, 0, 0, 0.4)
        link: "#3273dc"
        link-hover: "#ffdd57"

    # Functional groups (not location). Each renders as a card; cards lay
    # out into auto columns. Service location is encoded in `tag:` so you
    # can scan visually which host hosts what.
    services:
      # -----------------------------------------------------------------
      - name: "Infrastructure"
        icon: "fas fa-network-wired"
        items:
          - name: "ArgoCD"
            subtitle: "GitOps controller"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/argocd.png"
            url: "https://argocd.k8s.notyouraverage.dev"
            target: "_blank"
            type: "Ping"
            endpoint: "https://argocd.k8s.notyouraverage.dev"
          - name: "Linkerd"
            subtitle: "Service mesh"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/cncf/artwork/main/projects/linkerd/icon/color/linkerd-icon-color.png"
            url: "https://linkerd.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Vault"
            subtitle: "Secrets management"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/vault.png"
            url: "https://vault.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Proxmox"
            subtitle: "Hypervisor — Athena"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/proxmox.png"
            url: "https://proxmox.athena.notyouraverage.dev"
            target: "_blank"
          - name: "Pangolin"
            subtitle: "Edge auth / SSO"
            tag: "edge"
            icon: "fas fa-shield-alt"
            url: "https://pangolin.notyouraverage.dev"
            target: "_blank"

      # -----------------------------------------------------------------
      - name: "Storage & Data"
        icon: "fas fa-database"
        items:
          - name: "Longhorn"
            subtitle: "Block storage"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/longhorn.png"
            url: "https://longhorn.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "MinIO Console"
            subtitle: "Object store UI — k8s"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/minio.png"
            url: "https://minio-console.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "MinIO S3"
            subtitle: "S3 API — k8s"
            tag: "k8s"
            icon: "fas fa-cube"
            url: "https://s3.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "MinIO Console"
            subtitle: "Object store UI — Athena"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/minio.png"
            url: "https://minio.athena.notyouraverage.dev"
            target: "_blank"
          - name: "MinIO S3"
            subtitle: "S3 API — Athena (runner cache)"
            tag: "athena"
            icon: "fas fa-cube"
            url: "https://s3.athena.notyouraverage.dev"
            target: "_blank"
          - name: "StackGres"
            subtitle: "Postgres operator UI"
            tag: "k8s"
            icon: "fas fa-elephant"
            url: "https://stackgres.k8s.notyouraverage.dev"
            target: "_blank"

      # -----------------------------------------------------------------
      - name: "Apps"
        icon: "fas fa-th-large"
        items:
          - name: "Mixpost"
            subtitle: "Social scheduler"
            tag: "k8s"
            icon: "fas fa-share-alt"
            url: "https://mixpost.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Immich"
            subtitle: "Photos"
            tag: "zeus"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/immich.png"
            url: "https://immich.zeus.notyouraverage.dev"
            target: "_blank"
          - name: "n8n"
            subtitle: "Workflow automation"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/n8n.png"
            url: "https://n8n.athena.notyouraverage.dev"
            target: "_blank"
          - name: "Excalidraw"
            subtitle: "Whiteboarding"
            tag: "athena"
            icon: "fas fa-pencil-ruler"
            url: "https://excalidraw.athena.notyouraverage.dev"
            target: "_blank"
          - name: "LocalStack"
            subtitle: "Local AWS emulator"
            tag: "k8s"
            icon: "fas fa-cloud"
            url: "https://localstack-k8s.notyouraverage.dev"
            target: "_blank"

      # -----------------------------------------------------------------
      - name: "Observability & Security"
        icon: "fas fa-chart-line"
        items:
          - name: "Grafana"
            subtitle: "Dashboards & alerts"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/grafana.png"
            url: "https://grafana.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Zabbix"
            subtitle: "Infrastructure monitoring"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/zabbix.png"
            url: "https://zabbix.athena.notyouraverage.dev"
            target: "_blank"
          - name: "Wazuh"
            subtitle: "SIEM / endpoint security"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/wazuh.png"
            url: "https://wazuh.athena.notyouraverage.dev"
            target: "_blank"
          - name: "Web Check"
            subtitle: "Site analyzer"
            tag: "athena"
            icon: "fas fa-search-location"
            url: "https://web-check.athena.notyouraverage.dev"
            target: "_blank"

      # -----------------------------------------------------------------
      - name: "Code & Ops"
        icon: "fas fa-code"
        items:
          - name: "GitLab"
            subtitle: "Self-hosted SCM + CI"
            tag: "self"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/gitlab.png"
            url: "https://gitlab.notyouraverage.dev"
            target: "_blank"
          - name: "GitLab Runners"
            subtitle: "Cache: s3.athena → gitlab-nyad-runner-caches"
            tag: "k8s"
            icon: "fas fa-cogs"
            url: "https://gitlab.notyouraverage.dev/admin/runners"
            target: "_blank"
          - name: "Cloudflare"
            subtitle: "DNS / tunnels / WAF"
            tag: "saas"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/cloudflare.png"
            url: "https://dash.cloudflare.com"
            target: "_blank"
          - name: "Anthropic Console"
            subtitle: "Claude API"
            tag: "saas"
            icon: "fas fa-robot"
            url: "https://console.anthropic.com"
            target: "_blank"

      # -----------------------------------------------------------------
      # Mac Mini services — reachable only inside Tailscale VPN.
      - name: "Mac Mini (Tailscale)"
        icon: "fab fa-apple"
        items:
          - name: "OpenClaw Gateway"
            subtitle: "as-mac-mini.dzo-bee.ts.net — Tailscale only"
            tag: "tailscale"
            icon: "fas fa-network-wired"
            url: "https://as-mac-mini.dzo-bee.ts.net/overview"
            target: "_blank"
          - name: "Iris Dashboard"
            subtitle: "as-mac-mini.dzo-bee.ts.net:8081 — Tailscale only"
            tag: "tailscale"
            icon: "fas fa-eye"
            url: "http://as-mac-mini.dzo-bee.ts.net:8081/"
            target: "_blank"

      # -----------------------------------------------------------------
      # Unraid placeholder — replace when URLs are known.
      # - name: "Unraid"
      #   icon: "fas fa-hdd"
      #   items:
      #     - name: "Unraid WebUI"
      #       subtitle: "TODO"
      #       tag: "unraid"
      #       icon: "fas fa-cog"
      #       url: "http://unraid.local"
      #       target: "_blank"
