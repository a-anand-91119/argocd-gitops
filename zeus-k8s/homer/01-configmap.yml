    title: "Notyouraverage"
    subtitle: "homelab — Public view"
    documentTitle: "Homelab"
    icon: "fas fa-bolt"
    header: true
    footer: false
    columns: "auto"
    connectivityCheck: true

    message:
      style: "is-success"
      title: "Public view"
      icon: "fas fa-globe"
      content: "All URLs are public via Cloudflare Tunnel + Pangolin auth. Switch views from the header to use Tailscale or LAN paths."

    links:
      - name: "Public view"
        icon: "fas fa-globe"
        url: "#"
      - name: "Tailscale view"
        icon: "fas fa-network-wired"
        url: "#tailscale"
      - name: "LAN view"
        icon: "fas fa-house-laptop"
        url: "#lan"
      - name: "Pangolin"
        icon: "fas fa-shield-alt"
        url: "https://pangolin.notyouraverage.dev"
        target: "_blank"
      - name: "Repo"
        icon: "fas fa-code-branch"
        url: "https://gitlab.notyouraverage.dev/a.anand.91119/argocd-gitops"
        target: "_blank"

    defaults:
      layout: columns
      colorTheme: auto

    theme: default
