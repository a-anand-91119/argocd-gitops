  # ===========================================================================
  # LAN VIEW
  # Same group structure; URLs use private IPs where known. Tiles
  # without a LAN endpoint fall back to the public URL (Pangolin still
  # answers from the LAN). The Mac Mini group also adds LAN-only
  # services (ClawMetry, ClawBridge, Uptime Kuma, System Metrics).
  # Smart cards (Pi-hole, Proxmox, Uptime Kuma) live here because the
  # APIs are typically only exposed on the private network.
  # Layout = list (denser, more readable for IP-heavy content).
  # ===========================================================================
  lan.yml: |
    title: "Notyouraverage"
    subtitle: "homelab — LAN view"
    documentTitle: "Homelab (LAN)"
    icon: "fas fa-house-laptop"
    header: true
    footer: false
    columns: "auto"
    connectivityCheck: true

    message:
      style: "is-warning"
      title: "LAN view"
      icon: "fas fa-house-laptop"
      content: "Direct private-IP access. Only works while on the home network. Tiles without a known LAN endpoint fall back to the public URL."

    links:
      - name: "Public view"
        icon: "fas fa-globe"
        url: "#"
      - name: "Tailscale view"
        icon: "fas fa-network-wired"
        url: "#tailscale"
      - name: "LAN view"
        icon: "fas fa-house-laptop"
        url: "#lan"

    defaults:
      layout: list
      colorTheme: auto

    theme: default

    services:
      - name: "⭐ Favourites"
        icon: "fas fa-star"
        items:
          - name: "ArgoCD"
            subtitle: "argocd.k8s.notyouraverage.dev (no LAN endpoint)"
