---
# Homer dashboard config. Single source of truth for the homelab landing page.
#
# All URLs are Pangolin-fronted (auth-gated at the edge). To add a new entry:
# copy any `- name:` block under the relevant `services[].items` and adjust.
# Switch between FontAwesome and a logo URL via `icon:` OR `logo:` (not both).
#
# Mounted at /www/assets/config.yml in the b4bz/homer container.
# Updates propagate on next browser refresh — kubelet syncs the subPath-mounted
# ConfigMap within ~60s (no pod restart needed).
apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: homer
data:
  config.yml: |
    title: "Notyouraverage Homelab"
    subtitle: "Central Hub"
    documentTitle: "Homelab"
    logo: "https://raw.githubusercontent.com/bastienwirtz/homer/main/public/logo.png"
    header: true
    footer: false

    columns: "auto"
    connectivityCheck: true

    defaults:
      layout: columns
      colorTheme: auto

    theme: default
    colors:
      light:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#f5f5f5"
        card-background: "#ffffff"
        text: "#363636"
        text-header: "#ffffff"
        text-title: "#303030"
        text-subtitle: "#424242"
        card-shadow: rgba(0, 0, 0, 0.1)
        link: "#3273dc"
        link-hover: "#363636"
      dark:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#131313"
        card-background: "#2b2b2b"
        text: "#eaeaea"
        text-header: "#ffffff"
        text-title: "#fafafa"
        text-subtitle: "#f5f5f5"
        card-shadow: rgba(0, 0, 0, 0.4)
        link: "#3273dc"
        link-hover: "#ffdd57"

    # Each top-level entry under `services` renders as a tab/section in Homer.
    # Tabs grouped by location/domain. All URLs are Pangolin-fronted.
    services:
      # ---------------------------------------------------------------------
      # Kubernetes cluster services — *.k8s.notyouraverage.dev
      - name: "Zeus K8s"
        icon: "fas fa-dharmachakra"
        items:
          - name: "ArgoCD"
            subtitle: "GitOps controller"
            logo: "https://raw.githubusercontent.com/cncf/artwork/main/projects/argo/icon/color/argo-icon-color.png"
            url: "https://argocd.k8s.notyouraverage.dev"
            target: "_blank"
            tag: "infra"
          - name: "Grafana"
            subtitle: "Dashboards"
            logo: "https://grafana.com/static/img/menu/grafana2.svg"
            url: "https://grafana.k8s.notyouraverage.dev"
            target: "_blank"
            tag: "obs"
          - name: "Linkerd"
            subtitle: "Service mesh"
            logo: "https://raw.githubusercontent.com/cncf/artwork/main/projects/linkerd/icon/color/linkerd-icon-color.png"
            url: "https://linkerd.k8s.notyouraverage.dev"
            target: "_blank"
            tag: "infra"
          - name: "Longhorn"
            subtitle: "Block storage"
            icon: "fas fa-hdd"
            url: "https://longhorn.k8s.notyouraverage.dev"
            target: "_blank"
            tag: "storage"
          - name: "Vault"
            subtitle: "Secrets"
            icon: "fas fa-key"
            url: "https://vault.k8s.notyouraverage.dev"
            target: "_blank"
            tag: "infra"
          - name: "StackGres"
            subtitle: "Postgres operator UI"
            icon: "fas fa-database"
            url: "https://stackgres.k8s.notyouraverage.dev"
            target: "_blank"
            tag: "data"
          - name: "MinIO Console"
            subtitle: "Object storage UI"
            logo: "https://min.io/resources/img/logo/MINIO_wordmark.png"
            url: "https://minio-console.k8s.notyouraverage.dev"
            target: "_blank"
            tag: "storage"
          - name: "MinIO S3"
            subtitle: "S3 API endpoint"
            icon: "fas fa-cube"
            url: "https://s3.k8s.notyouraverage.dev"
            target: "_blank"
            tag: "api"
          - name: "Mixpost"
            subtitle: "Social scheduler"
            icon: "fas fa-share-alt"
            url: "https://mixpost.k8s.notyouraverage.dev"
            target: "_blank"
            tag: "app"
          # Uncomment when ingresses land:
          # - name: "Kafka UI"
          #   icon: "fas fa-stream"
          #   url: "https://kafka-ui.k8s.notyouraverage.dev"
          #   target: "_blank"
          # - name: "Prometheus"
          #   icon: "fas fa-fire"
          #   url: "https://prometheus.k8s.notyouraverage.dev"
          #   target: "_blank"

      # ---------------------------------------------------------------------
      # Athena (Proxmox host) — *.athena.notyouraverage.dev
      - name: "Athena (Proxmox)"
        icon: "fas fa-server"
        items:
          - name: "Proxmox"
            subtitle: "Hypervisor"
            icon: "fas fa-microchip"
            url: "https://proxmox.athena.notyouraverage.dev"
            target: "_blank"
            tag: "hypervisor"
          - name: "MinIO Console (Athena)"
            subtitle: "Proxmox-hosted object store UI"
            logo: "https://min.io/resources/img/logo/MINIO_wordmark.png"
            url: "https://minio.athena.notyouraverage.dev"
            target: "_blank"
            tag: "storage"
          - name: "MinIO S3 (Athena)"
            subtitle: "S3 API — gitlab runner cache lives here"
            icon: "fas fa-cube"
            url: "https://s3.athena.notyouraverage.dev"
            target: "_blank"
            tag: "api"
          - name: "Excalidraw"
            subtitle: "Whiteboarding"
            icon: "fas fa-pencil-ruler"
            url: "https://excalidraw.athena.notyouraverage.dev"
            target: "_blank"
            tag: "app"
          - name: "n8n"
            subtitle: "Workflow automation"
            icon: "fas fa-project-diagram"
            url: "https://n8n.athena.notyouraverage.dev"
            target: "_blank"
            tag: "app"
          - name: "Wazuh"
            subtitle: "SIEM / endpoint security"
            icon: "fas fa-shield-virus"
            url: "https://wazuh.athena.notyouraverage.dev"
            target: "_blank"
            tag: "security"
          - name: "Web Check"
            subtitle: "Site analysis tool"
            icon: "fas fa-search-location"
            url: "https://web-check.athena.notyouraverage.dev"
            target: "_blank"
            tag: "tool"
          - name: "Zabbix"
            subtitle: "Infrastructure monitoring"
            icon: "fas fa-heartbeat"
            url: "https://zabbix.athena.notyouraverage.dev"
            target: "_blank"
            tag: "obs"

      # ---------------------------------------------------------------------
      # Zeus host (non-k8s) — *.zeus.notyouraverage.dev
      - name: "Zeus Host"
        icon: "fas fa-bolt"
        items:
          - name: "Immich"
            subtitle: "Photos"
            icon: "fas fa-images"
            url: "https://immich.zeus.notyouraverage.dev"
            target: "_blank"
            tag: "media"

      # ---------------------------------------------------------------------
      - name: "Mac Mini"
        icon: "fab fa-apple"
        items:
          - name: "Mac Mini Homer (local)"
            subtitle: "TODO: replace with real URL"
            icon: "fas fa-house-user"
            url: "http://homer.macmini.local"
            target: "_blank"
            tag: "todo"
          # Add real entries here when URLs are known.

      # ---------------------------------------------------------------------
      - name: "Unraid"
        icon: "fas fa-hdd"
        items:
          - name: "Unraid WebUI"
            subtitle: "TODO: replace with real URL"
            icon: "fas fa-cog"
            url: "http://unraid.local"
            target: "_blank"
            tag: "todo"

      # ---------------------------------------------------------------------
      - name: "External"
        icon: "fas fa-globe"
        items:
          - name: "Pangolin"
            subtitle: "Edge auth / SSO admin"
            icon: "fas fa-shield-alt"
            url: "https://pangolin.notyouraverage.dev"
            target: "_blank"
          - name: "GitLab (self-hosted)"
            subtitle: "Code & CI"
            logo: "https://about.gitlab.com/images/press/logo/png/gitlab-icon-1-color-black-rgb.png"
            url: "https://gitlab.notyouraverage.dev"
            target: "_blank"
          - name: "Cloudflare"
            subtitle: "DNS / tunnels / WAF"
            logo: "https://www.cloudflare.com/img/logo-cloudflare.svg"
            url: "https://dash.cloudflare.com"
            target: "_blank"
          - name: "GitLab.com"
            subtitle: "Public mirrors"
            logo: "https://about.gitlab.com/images/press/logo/png/gitlab-icon-1-color-black-rgb.png"
            url: "https://gitlab.com"
            target: "_blank"
          - name: "Anthropic Console"
            subtitle: "Claude API"
            icon: "fas fa-robot"
            url: "https://console.anthropic.com"
            target: "_blank"
