---
# Homer dashboard config — single-page column grid grouped by function.
# Icons: NX211/homer-icons (community standard) + FontAwesome fallback.
# Smart `type: Ping` cards attempt a live status check; CORS may keep the
# indicator grey for cross-origin Pangolin resources, which is fine.
#
# Mounted at /www/assets/config.yml. Updates propagate within ~60s on
# browser refresh — no pod restart required.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: homer
data:
  config.yml: |
    title: "Notyouraverage"
    subtitle: "homelab"
    documentTitle: "Homelab"
    icon: "fas fa-bolt"
    header: true
    footer: false

    # Auto picks 1-4 columns based on viewport. Set "3" or "4" to lock.
    columns: "auto"
    connectivityCheck: true

    # Top notification bar — useful for ops messages or links to monitoring.
    message:
      style: "is-dark"
      title: "Status"
      icon: "fa fa-grip-horizontal"
      content: "Self-hosted services across Zeus K8s, Athena (Proxmox), and Zeus host. All public URLs are auth-gated via Pangolin."

    # Header quick-links (top-right).
    # `#tailscale` switches the dashboard to the Tailscale-flavored view
    # (loads assets/tailscale.yml via Homer's hash router). The rest are
    # bookmarks for things hit constantly that don't deserve their own card.
    links:
      - name: "Public view"
        icon: "fas fa-globe"
        url: "#"
      - name: "Tailscale view"
        icon: "fas fa-network-wired"
        url: "#tailscale"
      - name: "LAN view"
        icon: "fas fa-house-laptop"
        url: "#lan"
      - name: "Pangolin"
        icon: "fas fa-shield-alt"
        url: "https://pangolin.notyouraverage.dev"
        target: "_blank"
      - name: "GitLab"
        icon: "fab fa-gitlab"
        url: "https://gitlab.notyouraverage.dev"
        target: "_blank"
      - name: "Repo"
        icon: "fas fa-code-branch"
        url: "https://gitlab.notyouraverage.dev/a.anand.91119/argocd-gitops"
        target: "_blank"

    defaults:
      layout: columns
      colorTheme: auto

    theme: default
    colors:
      light:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#f5f5f5"
        card-background: "#ffffff"
        text: "#363636"
        text-header: "#ffffff"
        text-title: "#303030"
        text-subtitle: "#424242"
        card-shadow: rgba(0, 0, 0, 0.1)
        link: "#3273dc"
        link-hover: "#363636"
      dark:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#131313"
        card-background: "#2b2b2b"
        text: "#eaeaea"
        text-header: "#ffffff"
        text-title: "#fafafa"
        text-subtitle: "#f5f5f5"
        card-shadow: rgba(0, 0, 0, 0.4)
        link: "#3273dc"
        link-hover: "#ffdd57"

    # Functional groups (not location). Each renders as a card; cards lay
    # out into auto columns. Service location is encoded in `tag:` so you
    # can scan visually which host hosts what.
    services:
      # -----------------------------------------------------------------
      - name: "Infrastructure"
        icon: "fas fa-network-wired"
        items:
          - name: "ArgoCD"
            subtitle: "GitOps controller"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/argocd.png"
            url: "https://argocd.k8s.notyouraverage.dev"
            target: "_blank"
            type: "Ping"
            endpoint: "https://argocd.k8s.notyouraverage.dev"
          - name: "Linkerd"
            subtitle: "Service mesh"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/cncf/artwork/main/projects/linkerd/icon/color/linkerd-icon-color.png"
            url: "https://linkerd.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Vault"
            subtitle: "Secrets management"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/vault.png"
            url: "https://vault.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Proxmox"
            subtitle: "Hypervisor — Athena"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/proxmox.png"
            url: "https://proxmox.athena.notyouraverage.dev"
            target: "_blank"
          - name: "Pangolin"
            subtitle: "Edge auth / SSO"
            tag: "edge"
            icon: "fas fa-shield-alt"
            url: "https://pangolin.notyouraverage.dev"
            target: "_blank"

      # -----------------------------------------------------------------
      - name: "Storage & Data"
        icon: "fas fa-database"
        items:
          - name: "Longhorn"
            subtitle: "Block storage"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/longhorn.png"
            url: "https://longhorn.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "MinIO Console"
            subtitle: "Object store UI — Athena"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/minio.png"
            url: "https://minio.athena.notyouraverage.dev"
            target: "_blank"
          - name: "MinIO S3"
            subtitle: "S3 API — Athena (runner cache)"
            tag: "athena"
            icon: "fas fa-cube"
            url: "https://s3.athena.notyouraverage.dev"
            target: "_blank"

      # -----------------------------------------------------------------
      - name: "Apps"
        icon: "fas fa-th-large"
        items:
          - name: "Mixpost"
            subtitle: "Social scheduler"
            tag: "k8s"
            icon: "fas fa-share-alt"
            url: "https://mixpost.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Immich"
            subtitle: "Photos"
            tag: "zeus"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/immich.png"
            url: "https://immich.zeus.notyouraverage.dev"
            target: "_blank"
          - name: "n8n"
            subtitle: "Workflow automation"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/n8n.png"
            url: "https://n8n.athena.notyouraverage.dev"
            target: "_blank"
          - name: "Excalidraw"
            subtitle: "Whiteboarding"
            tag: "athena"
            icon: "fas fa-pencil-ruler"
            url: "https://excalidraw.athena.notyouraverage.dev"
            target: "_blank"
          - name: "LocalStack"
            subtitle: "Local AWS emulator"
            tag: "k8s"
            icon: "fas fa-cloud"
            url: "https://localstack-k8s.notyouraverage.dev"
            target: "_blank"

      # -----------------------------------------------------------------
      - name: "Observability & Security"
        icon: "fas fa-chart-line"
        items:
          - name: "Grafana"
            subtitle: "Dashboards & alerts"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/grafana.png"
            url: "https://grafana.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Zabbix"
            subtitle: "Infrastructure monitoring"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/zabbix.png"
            url: "https://zabbix.athena.notyouraverage.dev"
            target: "_blank"
          - name: "Wazuh"
            subtitle: "SIEM / endpoint security"
            tag: "athena"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/wazuh.png"
            url: "https://wazuh.athena.notyouraverage.dev"
            target: "_blank"
          - name: "Web Check"
            subtitle: "Site analyzer"
            tag: "athena"
            icon: "fas fa-search-location"
            url: "https://web-check.athena.notyouraverage.dev"
            target: "_blank"

      # -----------------------------------------------------------------
      - name: "Code & Ops"
        icon: "fas fa-code"
        items:
          - name: "GitLab"
            subtitle: "Self-hosted SCM + CI"
            tag: "self"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/gitlab.png"
            url: "https://gitlab.notyouraverage.dev"
            target: "_blank"
          - name: "GitLab Runners"
            subtitle: "Cache: s3.athena → gitlab-nyad-runner-caches"
            tag: "k8s"
            icon: "fas fa-cogs"
            url: "https://gitlab.notyouraverage.dev/admin/runners"
            target: "_blank"
          - name: "Cloudflare"
            subtitle: "DNS / tunnels / WAF"
            tag: "saas"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/cloudflare.png"
            url: "https://dash.cloudflare.com"
            target: "_blank"
          - name: "Anthropic Console"
            subtitle: "Claude API"
            tag: "saas"
            icon: "fas fa-robot"
            url: "https://console.anthropic.com"
            target: "_blank"

      # -----------------------------------------------------------------
      # Mac Mini services — reachable only inside Tailscale VPN.
      - name: "Mac Mini (Tailscale)"
        icon: "fab fa-apple"
        items:
          - name: "OpenClaw Gateway"
            subtitle: "as-mac-mini.dzo-bee.ts.net — Tailscale only"
            tag: "tailscale"
            icon: "fas fa-network-wired"
            url: "https://as-mac-mini.dzo-bee.ts.net/overview"
            target: "_blank"
          - name: "Iris Dashboard"
            subtitle: "homer.iris.notyouraverage.dev — public via Pangolin"
            tag: "public"
            icon: "fas fa-eye"
            url: "https://homer.iris.notyouraverage.dev/"
            target: "_blank"

      # -----------------------------------------------------------------
      # Unraid placeholder — replace when URLs are known.
      # - name: "Unraid"
      #   icon: "fas fa-hdd"
      #   items:
      #     - name: "Unraid WebUI"
      #       subtitle: "TODO"
      #       tag: "unraid"
      #       icon: "fas fa-cog"
      #       url: "http://unraid.local"
      #       target: "_blank"

  # Tailscale-flavored variant of the dashboard. Loaded by Homer's hash
  # router when the user clicks the "Tailscale view" header link
  # (#tailscale → fetches assets/tailscale.yml and re-renders).
  #
  # Only Mac Mini services have Tailscale-native URLs today; everything
  # else still uses its public Pangolin URL (Tailscale doesn't block
  # public traffic, so they remain reachable). Add a `lan.yml` sibling
  # the same way once LAN IPs are known.
  #
  # Keep service groups in sync with config.yml — only the URLs differ.
  tailscale.yml: |
    title: "Notyouraverage"
    subtitle: "homelab — Tailscale view"
    documentTitle: "Homelab (Tailscale)"
    icon: "fas fa-network-wired"
    header: true
    footer: false
    columns: "auto"
    connectivityCheck: true

    message:
      style: "is-info"
      title: "Tailscale view"
      icon: "fas fa-network-wired"
      content: "Mac Mini services use Tailscale DNS (as-mac-mini.dzo-bee.ts.net). Public services keep their Pangolin URLs — they work over Tailscale too."

    links:
      - name: "Public view"
        icon: "fas fa-globe"
        url: "#"
      - name: "Tailscale view"
        icon: "fas fa-network-wired"
        url: "#tailscale"
      - name: "LAN view"
        icon: "fas fa-house-laptop"
        url: "#lan"
      - name: "Pangolin"
        icon: "fas fa-shield-alt"
        url: "https://pangolin.notyouraverage.dev"
        target: "_blank"

    defaults:
      layout: columns
      colorTheme: auto

    theme: default

    services:
      - name: "Mac Mini (Tailscale)"
        icon: "fab fa-apple"
        items:
          - name: "OpenClaw Gateway"
            subtitle: "as-mac-mini.dzo-bee.ts.net/overview"
            tag: "tailscale"
            icon: "fas fa-network-wired"
            url: "https://as-mac-mini.dzo-bee.ts.net/overview"
            target: "_blank"
          - name: "Iris Dashboard"
            subtitle: "as-mac-mini.dzo-bee.ts.net:8081"
            tag: "tailscale"
            icon: "fas fa-eye"
            url: "http://as-mac-mini.dzo-bee.ts.net:8081/"
            target: "_blank"

      - name: "Public services (still reachable over Tailscale)"
        icon: "fas fa-globe"
        items:
          - name: "ArgoCD"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/argocd.png"
            url: "https://argocd.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "Grafana"
            tag: "k8s"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/grafana.png"
            url: "https://grafana.k8s.notyouraverage.dev"
            target: "_blank"
          - name: "GitLab"
            tag: "self"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/gitlab.png"
            url: "https://gitlab.notyouraverage.dev"
            target: "_blank"
          - name: "Pangolin"
            tag: "edge"
            icon: "fas fa-shield-alt"
            url: "https://pangolin.notyouraverage.dev"
            target: "_blank"

  # LAN-flavored variant. Loaded by Homer's hash router on #lan.
  # Replace every TODO_* with the actual private IP / port. Each entry
  # works independently — partial fill-in is fine; just delete the items
  # you don't have yet rather than leaving TODO URLs that 404. Keep the
  # structure mirroring config.yml / tailscale.yml so views stay
  # comparable. Reloader will roll the deployment after each edit.
  lan.yml: |
    title: "Notyouraverage"
    subtitle: "homelab — LAN view"
    documentTitle: "Homelab (LAN)"
    icon: "fas fa-house-laptop"
    header: true
    footer: false
    columns: "auto"
    connectivityCheck: true

    message:
      style: "is-warning"
      title: "LAN view"
      icon: "fas fa-house-laptop"
      content: "Direct private-IP access. Only works when you're on the home network. Fill in the TODO_* placeholders in lan.yml as IPs are confirmed."

    links:
      - name: "Public view"
        icon: "fas fa-globe"
        url: "#"
      - name: "Tailscale view"
        icon: "fas fa-network-wired"
        url: "#tailscale"
      - name: "LAN view"
        icon: "fas fa-house-laptop"
        url: "#lan"

    defaults:
      layout: columns
      colorTheme: auto

    theme: default

    services:
      # ---------------------------------------------------------------
      - name: "Mac Mini (LAN)"
        icon: "fab fa-apple"
        items:
          - name: "OpenClaw Gateway"
            subtitle: "TODO — replace with http://<mac-mini-lan-ip>/overview"
            tag: "lan"
            icon: "fas fa-network-wired"
            url: "http://TODO_MAC_MINI_LAN_IP/overview"
            target: "_blank"
          - name: "Iris Dashboard"
            subtitle: "TODO — replace with http://<mac-mini-lan-ip>:8081/"
            tag: "lan"
            icon: "fas fa-eye"
            url: "http://TODO_MAC_MINI_LAN_IP:8081/"
            target: "_blank"

      # ---------------------------------------------------------------
      # Zeus Kubernetes — direct LoadBalancer / NodePort IPs (if any).
      # Most k8s services are only exposed via the cloudflare-tunnel
      # ingress, so they have no LAN URL. Add only the ones with a real
      # LAN endpoint (e.g. MetalLB-assigned IP, NodePort).
      - name: "Zeus K8s (LAN)"
        icon: "fas fa-network-wired"
        items:
          - name: "ArgoCD"
            subtitle: "TODO — LAN IP if exposed via MetalLB/NodePort"
            tag: "lan"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/argocd.png"
            url: "http://TODO_ARGOCD_LAN_IP"
            target: "_blank"
          - name: "Grafana"
            subtitle: "TODO — LAN IP if exposed"
            tag: "lan"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/grafana.png"
            url: "http://TODO_GRAFANA_LAN_IP:3000"
            target: "_blank"

      # ---------------------------------------------------------------
      # Athena (Proxmox host) — confirmed LAN endpoints.
      - name: "Athena (LAN)"
        icon: "fas fa-server"
        items:
          - name: "Proxmox"
            subtitle: "192.168.0.254:8006"
            tag: "lan"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/proxmox.png"
            url: "https://192.168.0.254:8006"
            target: "_blank"
          - name: "MinIO Console"
            subtitle: "192.168.0.169:9001"
            tag: "lan"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/minio.png"
            url: "http://192.168.0.169:9001/login"
            target: "_blank"
          - name: "n8n"
            subtitle: "192.168.0.176:5678"
            tag: "lan"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/n8n.png"
            url: "http://192.168.0.176:5678/signin?redirect=%252F"
            target: "_blank"
          - name: "Wazuh"
            subtitle: "192.168.0.188"
            tag: "lan"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/wazuh.png"
            url: "https://192.168.0.188/app/login?"
            target: "_blank"
          - name: "Excalidraw"
            subtitle: "192.168.0.25:3000"
            tag: "lan"
            icon: "fas fa-pencil-ruler"
            url: "http://192.168.0.25:3000/"
            target: "_blank"
          - name: "Web Check"
            subtitle: "192.168.0.251:3000"
            tag: "lan"
            icon: "fas fa-search-location"
            url: "http://192.168.0.251:3000/"
            target: "_blank"

      # ---------------------------------------------------------------
      # Zeus host (bare-metal) — services running directly on the host.
      - name: "Zeus host (LAN)"
        icon: "fas fa-hdd"
        items:
          - name: "Immich"
            subtitle: "TODO — http://<zeus-lan-ip>:2283"
            tag: "lan"
            logo: "https://raw.githubusercontent.com/NX211/homer-icons/master/png/immich.png"
            url: "http://TODO_ZEUS_LAN_IP:2283"
            target: "_blank"
