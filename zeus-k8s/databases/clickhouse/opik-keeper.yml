---
# Single-node Keeper dedicated to the chc-opik ClickHouse cluster.
# A separate Keeper avoids cross-cluster authentication setup that
# would otherwise need each cluster's per-secret keeper-identity to
# be allow-listed in the shared Keeper. No HA — Opik tolerates
# storage-only HA via its Longhorn PVC.
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: chk-opik
  namespace: clickhouse
spec:
  replicas: 1

  containerTemplate:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi

  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn
    resources:
      requests:
        storage: 5Gi
