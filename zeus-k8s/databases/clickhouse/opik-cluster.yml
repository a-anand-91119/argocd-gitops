---
# Single-node ClickHouse for Opik. Opik's Liquibase migrations are not
# cluster-aware (mix of `ON CLUSTER 'default'` and plain CREATE TABLE),
# so they only work cleanly against a 1-shard/1-replica cluster. We
# share the chk Keeper with the main `chc` cluster — Replicated
# tables Opik creates still get internal coordination, even though the
# cluster has nowhere to replicate to.
#
# Storage-HA only: the pod's Longhorn PVC reattaches on node failure.
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: chc-opik
  namespace: clickhouse
spec:
  shards: 1
  replicas: 1

  keeperClusterRef:
    name: chk-opik

  containerTemplate:
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 4
        memory: 4Gi

  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn
    resources:
      requests:
        storage: 50Gi

  settings:
    extraUsersConfig:
      profiles:
        default:
          database_replicated_allow_replicated_engine_arguments: 1
      users:
        opik:
          password_sha256_hex: 903cb32504c1751d134a881c6001875b35aad245cdbbfa5109f7a50e2b400988
          networks:
            ip: ::/0
          profile: default
          quota: default
          grants:
            - query: GRANT ALL ON *.* WITH GRANT OPTION
