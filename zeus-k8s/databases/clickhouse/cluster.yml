---
# 2 shards x 2 replicas = 4 ClickHouse pods. Each shard is fully replicated,
# so any single replica (or any single shard's secondary) can fail without
# data loss. Coordination is delegated to the `chk` KeeperCluster.
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: chc
  namespace: clickhouse
spec:
  shards: 2
  replicas: 2

  keeperClusterRef:
    name: chk

  containerTemplate:
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 4
        memory: 8Gi

  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn
    resources:
      requests:
        storage: 50Gi

  podDisruptionBudget:
    minAvailable: 1

  settings:
    extraUsersConfig:
      profiles:
        default:
          database_replicated_allow_replicated_engine_arguments: 1
      users:
        opik:
          password_sha256_hex: 903cb32504c1751d134a881c6001875b35aad245cdbbfa5109f7a50e2b400988
          networks:
            ip: ::/0
          profile: default
          quota: default
          grants:
            # Liquibase's `ON CLUSTER` migrations create transient tracking
            # tables in the `default` database, so opik needs cluster-wide
            # admin privileges, not just rights on opik.*.
            - query: GRANT ALL ON *.* WITH GRANT OPTION

  podTemplate:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            clickhouse.com/clickhouse-cluster: chc
