---
# UNSEALED placeholder Secret for Opik's external-service connections.
# DO NOT LEAVE THIS UNSEALED IN THE REPO — workflow:
#
#   1. Fill in the real values below (overwrite each REPLACE_ME_*).
#   2. Tell Claude to seal it. Claude will run:
#        kubeseal --format=yaml \
#          --controller-name=sealed-secrets-controller \
#          --controller-namespace=kube-system \
#          < zeus-k8s/opik/_secret-template.yml \
#          > zeus-k8s/secrets/opik-external-creds.yml
#      and then `git rm` this template file.
#
# These values are loaded into the Opik backend (via envFrom) and the
# Opik python-backend (via secretRefs). They override the empty
# defaults the chart writes when minio.enabled / redis.enabled = false.
#
# How to get each value:
#
# REDIS_URL — full connection string including password. Format:
#   redis://:<PASSWORD>@valkey-primary.valkey.svc.cluster.local:6379/0
#   Get the password from the existing Valkey SealedSecret:
#     kubectl get secret valkey-credentials -n valkey \
#       -o jsonpath='{.data.password}' | base64 -d
#
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — MinIO Athena access key.
#   Generate at https://minio.athena.notyouraverage.dev (or LAN IP
#   192.168.0.169:9001) > Access Keys > Create. Grant read/write on
#   the opik bucket only.
#
# S3_URL — point at MinIO Athena. From inside the cluster, prefer the
#   public Pangolin URL (TLS, durable hostname):
#     https://s3.athena.notyouraverage.dev
#   Or the LAN address if you'd rather avoid the public path:
#     http://192.168.0.169:9000
#
# S3_BUCKET — must exist before Opik starts. Create it in the MinIO
#   Athena console: bucket name "opik", default access (private).
apiVersion: v1
kind: Secret
metadata:
  name: opik-external-creds
  namespace: opik
type: Opaque
stringData:
  REDIS_URL: "redis://:REPLACE_ME_VALKEY_PASSWORD@valkey-primary.valkey.svc.cluster.local:6379/0"
  AWS_ACCESS_KEY_ID: "REPLACE_ME_MINIO_ATHENA_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME_MINIO_ATHENA_SECRET_KEY"
  S3_URL: "https://s3.athena.notyouraverage.dev"
  S3_BUCKET: "opik"
  S3_REGION: "us-east-1"
  IS_MINIO: "true"
