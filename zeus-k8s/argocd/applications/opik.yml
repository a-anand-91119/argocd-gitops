---
# Opik (comet-ml/opik): self-hosted LLM evaluation / tracing / prompt
# optimization platform. Chart-of-chart pattern — local wrapper at
# zeus-k8s/opik/ depends on the upstream chart from
# https://comet-ml.github.io/opik/. Same pattern as cnpg-operator.
#
# Reuses Valkey (in-cluster) and MinIO Athena instead of bundled
# Redis/MinIO. Bundled MySQL, ClickHouse, and Zookeeper stay.
#
# No ingress is created by this Application. Expose the frontend via
# Pangolin/Newt by adding a Pangolin resource that targets the
# in-cluster Service: opik.opik.svc.cluster.local:5173.
#
# Wave 30 (application band). Namespace from the namespaces aggregator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    app.kubernetes.io/managed-by: argocd-gitops-repo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: zeus-kubernetes
  source:
    repoURL: ssh://git@gitlab.notyouraverage.dev:8443/a.anand.91119/argocd-gitops.git
    targetRevision: HEAD
    path: zeus-k8s/opik
    helm:
      releaseName: opik
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: opik
  # ArgoCD 2.12.4's bundled OpenAPI schemas predate k8s 1.35's
  # status.terminatingReplicas field on Deployment/StatefulSet,
  # breaking the structured-merge diff under ServerSideApply.
  # Ignore it until ArgoCD is upgraded.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
