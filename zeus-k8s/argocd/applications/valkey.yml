---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    app.kubernetes.io/managed-by: argocd-gitops-repo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: valkey
    server: https://kubernetes.default.svc
  project: zeus-kubernetes
  source:
    helm:
      valueFiles:
        - values.yaml
    path: zeus-k8s/databases/valkey
    repoURL: ssh://git@gitlab.notyouraverage.dev:8443/a.anand.91119/argocd-gitops.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
