---
# mariadb: shared MariaDB Galera cluster + per-consumer Database/User/Grant CRs.
#
# Layout under zeus-k8s/databases/mariadb/ (recurse: true):
#   mariadb/   -> the MariaDB Galera CR (cluster itself, name=mariadb)
#   <svc>/     -> per-service Database + User + Grant against mariaDbRef.name=mariadb
#                 (e.g. mixpost/). Add new services as new sibling subdirs.
#
# destination.namespace is `mariadb` — all CRs live in the operator's namespace.
#
# syncOptions: ServerSideApply=true + RespectIgnoreDifferences=true so that the
# mariadb-operator's defaulting on the MariaDB CR (agent/config/galeraLibPath/
# initContainer/recovery/sst — things the operator fills in server-side) does
# not flap the Application as OutOfSync. ignoreDifferences via
# managedFieldsManagers=[mariadb-operator] is the stable way to say "don't
# diff fields owned by the operator" without enumerating a brittle jsonPointer
# list that the operator's version bumps can invalidate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    app.kubernetes.io/managed-by: argocd-gitops-repo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: zeus-kubernetes
  source:
    repoURL: ssh://git@gitlab.notyouraverage.dev:8443/a.anand.91119/argocd-gitops.git
    targetRevision: HEAD
    path: zeus-k8s/databases/mariadb
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: mariadb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: k8s.mariadb.com
      kind: MariaDB
      managedFieldsManagers:
        - mariadb-operator
