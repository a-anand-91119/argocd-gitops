apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '30'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/managed-by: argocd-gitops-repo
  name: grpc-stats-aggregator
  namespace: argocd
spec:
  destination:
    namespace: spring-projects
    server: https://kubernetes.default.svc
  project: zeus-kubernetes
  source:
    path: zeus-k8s/spring-projects/grpc-stats-aggregator
    repoURL: ssh://git@gitlab.notyouraverage.dev:8443/a.anand.91119/argocd-gitops.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
