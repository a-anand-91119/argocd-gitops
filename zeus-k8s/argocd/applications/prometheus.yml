apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '15'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/managed-by: argocd-gitops-repo
  name: prometheus
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  # ArgoCD 2.12.4's bundled OpenAPI schemas predate k8s 1.35's
  # status.terminatingReplicas field on Deployment/StatefulSet,
  # breaking the structured-merge diff under ServerSideApply.
  # Ignore it until ArgoCD is upgraded.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /status/terminatingReplicas
  project: zeus-kubernetes
  source:
    helm:
      valueFiles:
        - values.yml
    path: zeus-k8s/monitoring/prometheus
    repoURL: ssh://git@gitlab.notyouraverage.dev:8443/a.anand.91119/argocd-gitops.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
