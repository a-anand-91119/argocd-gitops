---
# UNSEALED placeholder Secret for Homepage widget credentials.
# DO NOT LEAVE THIS UNSEALED IN THE REPO — workflow:
#
#   1. Fill in the real values below (overwrite each REPLACE_ME_*).
#      You can copy/paste values straight from the Homer secret you
#      already prepared — same Pi-hole / Immich / Proxmox creds.
#   2. Tell Claude to seal it. Claude will run:
#        kubeseal --format=yaml \
#          --controller-name=sealed-secrets-controller \
#          --controller-namespace=kube-system \
#          < zeus-k8s/homepage/_secret-template.yml \
#          > zeus-k8s/secrets/homepage-secrets.yml
#      and then `git rm` this template file.
#   3. The sealed version under zeus-k8s/secrets/ is what ArgoCD applies.
#
# Homepage substitutes any {{HOMEPAGE_VAR_NAME}} occurrence in the
# ConfigMap YAML files using these env-var values at startup. No init
# container. Just envFrom on the deployment.
#
# Notes per field:
#  - PROXMOX_USER:          full user@realm!tokenid (e.g. homer@pve!homer)
#  - PROXMOX_TOKEN_SECRET:  just the UUID secret (NOT the PVEAPIToken= prefix)
#  - PROXMOX_NODE:          node hostname shown in the Proxmox UI tree
#  - PIHOLE_KEY:            Pi-hole UI > Settings > API > Show API token
#  - IMMICH_KEY:            Immich > Account Settings > API Keys (≥ 1.118)
apiVersion: v1
kind: Secret
metadata:
  name: homepage-secrets
  namespace: homepage
type: Opaque
stringData:
  HOMEPAGE_VAR_PROXMOX_USER: "REPLACE_ME_PROXMOX_USER"
  HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET: "REPLACE_ME_PROXMOX_TOKEN_SECRET"
  HOMEPAGE_VAR_PROXMOX_NODE: "REPLACE_ME_PROXMOX_NODE"
  HOMEPAGE_VAR_PIHOLE_KEY: "REPLACE_ME_PIHOLE_KEY"
  HOMEPAGE_VAR_IMMICH_KEY: "REPLACE_ME_IMMICH_KEY"
