---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    # Reload on changes to either the ConfigMap (services/widgets) or
    # the Secret (HOMEPAGE_VAR_* values feeding {{...}} placeholders).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: homepage
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            # HOMEPAGE_VAR_* values: PIHOLE_KEY, IMMICH_KEY,
            # PROXMOX_USER, PROXMOX_TOKEN_SECRET, PROXMOX_NODE.
            # Substituted into {{HOMEPAGE_VAR_*}} placeholders in the
            # ConfigMap YAML files at startup.
            - secretRef:
                name: homepage-secrets
                optional: true
          env:
            # Pangolin/Newt forwards the upstream pod IP as Host
            # (e.g. "10.244.21.190:3000"), so a static list never
            # matches. Allow all hosts — the actual security boundary
            # is Pangolin SSO in front, not Homepage's Host header.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
          volumeMounts:
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
              readOnly: true
            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
              readOnly: true
            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
              readOnly: true
            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
              readOnly: true
            - name: config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
              readOnly: true
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
              readOnly: true
            - name: config
              mountPath: /app/config/custom.css
              subPath: custom.css
              readOnly: true
            - name: config
              mountPath: /app/config/custom.js
              subPath: custom.js
              readOnly: true
            # Homepage writes runtime logs under /app/config/logs.
            # The parent /app/config is owned by the image's user and
            # not writable by UID 1000, so give logs/ its own emptyDir
            # (fsGroup: 1000 on the pod makes it group-writable).
            - name: logs
              mountPath: /app/config/logs
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: homepage-config
            items:
              - { key: settings.yaml,   path: settings.yaml }
              - { key: services.yaml,   path: services.yaml }
              - { key: widgets.yaml,    path: widgets.yaml }
              - { key: bookmarks.yaml,  path: bookmarks.yaml }
              - { key: docker.yaml,     path: docker.yaml }
              - { key: kubernetes.yaml, path: kubernetes.yaml }
              - { key: custom.css,      path: custom.css }
              - { key: custom.js,       path: custom.js }
        - name: logs
          emptyDir:
            sizeLimit: 16Mi
